
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barber Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #f5f5f5;
    }
    header {
      padding: 28px 16px;
      text-align: center;
      background: #1d1d1d;
      border-bottom: 2px solid #c49a55;
    }
    header h1 {
      margin: 0;
      color: #c49a55;
      letter-spacing: 3px;
    }
    header p { color: #bbb; }
    main {
      max-width: 500px;
      margin: 35px auto;
      padding: 24px;
    }
    h2 { text-align: center; }
    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
    }
    input, select, button {
      width: 100%;
      padding: 13px;
      border-radius: 6px;
      font-size: 16px;
    }
    input, select {
      background: #242424;
      color: white;
      border: 1px solid #555;
    }
    button {
      margin-top: 24px;
      background: #c49a55;
      color: #111;
      border: 0;
      font-weight: bold;
    }
    footer {
      text-align: center;
      color: #999;
      padding: 25px;
    }
  </style>
</head>
<body>
  <header>
    <h1>BARBER STUDIO</h1>
    <p>Twój styl. Twoja chwila.</p>
  </header>

  <main>
    <h2>Zarezerwuj wizytę</h2>
    <form id="booking">
      <label for="name">Imię</label>
      <input id="name" required placeholder="Twoje imię">

      <label for="phone">Numer telefonu</label>
      <input id="phone" type="tel" required placeholder="Numer telefonu">

      <label for="service">Wybierz usługę</label>
      <select id="service" required>
        <option value="">Wybierz usługę</option>
        <option>Strzyżenie</option>
        <option>Broda</option>
        <option>Strzyżenie i broda</option>
      </select>

      <label for="date">Data wizyty</label>
      <input id="date" type="date" required>

      <label for="time">Godzina</label>
      <select id="time" required>
        <option value="">Wybierz godzinę</option>
        <option>09:00</option>
        <option>10:00</option>
        <option>11:00</option>
        <option>12:00</option>
        <option>13:00</option>
        <option>14:00</option>
        <option>15:00</option>
        <option>16:00</option>
        <option>17:00</option>
      </select>

      <button type="submit">Zarezerwuj termin</button>
    </form>
    <p id="message" style="text-align:center"></p>
  </main>

  <footer>Barber Studio</footer>

  <script>
    document.getElementById("booking").addEventListener("submit", function(e) {
      e.preventDefault();
      document.getElementById("message").textContent =
        "Formularz działa, ale rezerwacja nie została jeszcze zapisana. System bazy danych dodamy w kolejnym kroku.";
    });
  </script>
</body>
</html>
